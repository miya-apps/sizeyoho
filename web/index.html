<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport を最初から固定する。これが無いと Flutter 起動時に
       画面倍率が切り替わり、スプラッシュのアイコンが急に大きく見える。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="成長曲線で、服と靴のサイズを予報する子どもの成長記録アプリ">
  <meta name="theme-color" content="#C8EDDB">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="サイズ予報">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>サイズ予報</title>
  <link rel="manifest" href="manifest.json">

  <!-- 起動画面：Flutter 読み込み中ずっと同じ大きさで表示（小→大の切り替えなし） -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      background: #C8EDDB;
      transition: opacity 0.4s ease-out;
    }
    #splash img {
      width: 200px;
      height: 200px;
      border-radius: 40px;
    }
    #splash .splash-name {
      margin-top: 8px;
      font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #3D444D;
      letter-spacing: 0.05em;
    }
    #splash .splash-tagline {
      margin-top: 6px;
      font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      color: #444;
      text-align: center;
    }
    #splash .splash-brand {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #666;
    }
    /* 起動中と分かるローディングドット */
    #splash .splash-loading {
      margin-top: 28px;
      display: flex;
      gap: 9px;
    }
    #splash .splash-loading span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3D444D;
      opacity: 0.25;
      animation: splash-dot 1.2s infinite ease-in-out;
    }
    #splash .splash-loading span:nth-child(2) { animation-delay: 0.2s; }
    #splash .splash-loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes splash-dot {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 0.9; transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-512.png" alt="サイズ予報">
    <div class="splash-name">サイズ予報</div>
    <div class="splash-tagline">成長曲線で、服と靴のサイズを予報</div>
    <div class="splash-brand">MIYA APPS</div>
    <div class="splash-loading"><span></span><span></span><span></span></div>
  </div>
  <script>
    // 最初から大きく表示し、最低 2.5 秒はこの画面を保つ。
    var splashStart = Date.now();
    var minSplashMs = 2500;

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var elapsed = Date.now() - splashStart;
      var wait = Math.max(0, minSplashMs - elapsed);
      setTimeout(function () {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 450);
      }, wait);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
