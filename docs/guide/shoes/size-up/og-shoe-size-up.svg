      <text x="58" y="36" fill="#256846" font-size="27" font-weight="800">サイズ予報</text>
    </g>

    <text x="66" y="190" fill="#3d444d" font-size="62" font-weight="900">子どもの靴は</text>
    <text x="66" y="270" fill="#256846" font-size="72" font-weight="900">いつサイズアップ？</text>
    <text x="69" y="327" fill="#59675f" font-size="28" font-weight="700">買い替え時期と見分け方を解説</text>

    <g transform="translate(66 388)">
      <g>
        <rect width="218" height="112" rx="24" fill="#ffffff" opacity="0.9"/>
        <text x="109" y="39" text-anchor="middle" fill="#5f6d66" font-size="20" font-weight="700">3歳まで</text>
        <text x="109" y="82" text-anchor="middle" fill="#256846" font-size="34" font-weight="900">3か月ごと</text>
      </g>
      <g transform="translate(232)">
        <rect width="218" height="112" rx="24" fill="#fff9ec" opacity="0.96"/>
