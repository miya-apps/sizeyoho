        <text x="109" y="82" text-anchor="middle" fill="#8b6b2f" font-size="34" font-weight="900">4か月ごと</text>
      </g>
      <g transform="translate(464)">
        <rect width="218" height="112" rx="24" fill="#f7f4fb" opacity="0.96"/>
        <text x="109" y="39" text-anchor="middle" fill="#6d6474" font-size="20" font-weight="700">7歳以降</text>
        <text x="109" y="82" text-anchor="middle" fill="#745b8b" font-size="34" font-weight="900">6か月ごと</text>
