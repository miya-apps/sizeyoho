<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8eddb"/>
      <stop offset="0.62" stop-color="#e2f5eb"/>
      <stop offset="1" stop-color="#f9e6df"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ddcf"/>
      <stop offset="1" stop-color="#efc3ad"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3d444d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <circle cx="110" cy="100" r="94" fill="#ffffff" opacity="0.35"/>
  <circle cx="1110" cy="550" r="145" fill="#fff8f4" opacity="0.58"/>

  <g font-family="Zen Maru Gothic, sans-serif">
    <g transform="translate(66 54)">
      <rect width="238" height="56" rx="28" fill="#ffffff" opacity="0.9"/>
      <circle cx="31" cy="28" r="18" fill="#4caf87"/>
