    </g>

    <text x="69" y="548" fill="#706f6a" font-size="21" font-weight="700">買い替え周期ではなく、足を測る・確認する周期の目安です</text>

    <g transform="translate(806 135) rotate(-8 160 160)">
      <path d="M38 103C43 55 88 29 155 31c73 2 128 47 146 105 16 51-5 124-49 158-41 31-135 28-183-7-47-35-45-124-31-184Z" fill="#ffffff" stroke="#6f9e86" stroke-width="7"/>
      <path d="M55 111c9-39 44-60 98-58 59 2 102 36 116 80 12 39-4 98-38 123-34 26-103 22-141-5-37-27-46-100-35-140Z" fill="url(#foot)" stroke="#d6a38c" stroke-width="2"/>
      <ellipse cx="234" cy="91" rx="27" ry="31" fill="#f1c7b4" stroke="#d6a38c" stroke-width="2"/>
      <ellipse cx="259" cy="123" rx="22" ry="25" fill="#f1c7b4" stroke="#d6a38c" stroke-width="2"/>
