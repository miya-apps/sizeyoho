  <path d="M110 406C128 391 180 391 201 406" fill="none" stroke="#8173B7" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M110 406C128 430 180 430 201 406" fill="none" stroke="#8173B7" stroke-width="6" stroke-linecap="round"/>
