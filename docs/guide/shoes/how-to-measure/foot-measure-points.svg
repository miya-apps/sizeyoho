<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
  <title id="title">子どもの足の足長・足幅・足囲を測る位置</title>
  <desc id="desc">上段は、かかとから最も長い指までの足長と、親指と小指の付け根を結ぶ足幅。下段は、その位置へメジャーを一周させる足囲を示しています。</desc>

  <defs>
    <path id="child-foot" d="M45 11.5L60 13.5L73.2 23L81.3 40L84 57.4L86.8 46L90.9 38L98 31.5L104 29.5L110 29.5L118 32.8L124 39.5L128.2 51L129 68.3L132.8 57L140 48.9L149 46.5L157 48.9L164.1 56L167.1 63L168.6 72L167.3 84L176 71.9L185 70.4L190 72L197.2 78L201.1 87L202.2 97L200 109.3L205 102.8L214 99.6L224 104.7L230.3 117L231.4 131L228.6 148L234.1 174L233.5 201L226 235L205.8 299L203.3 320L202.2 373L197.3 398L187.6 421L171 441.4L153 453.4L133 459.8L121 461.5L102 460.5L89 457.3L71 448L57.9 436L48.7 423L38.7 395L36.5 365L41.3 316L41.3 292L35.3 254L16.4 194L12 171L11.9 145L17.8 107L11.9 70L11.9 57L15.8 39L24.6 23L33 15.8Z"/>
    <style>
      text { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }
      .label { font-size: 16px; font-weight: 800; }
      .note { fill: #59675F; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect x="8" y="8" width="544" height="306" rx="26" fill="#F5FBF7" stroke="#DCE9E1" stroke-width="2"/>
  <rect x="28" y="26" width="112" height="30" rx="15" fill="#E4F4EB"/>
  <text x="84" y="46" text-anchor="middle" fill="#256846" font-size="14" font-weight="800">上から測る</text>

  <use href="#child-foot" xlink:href="#child-foot" transform="translate(218 60) scale(.498)" fill="#F7C7BA"/>

  <line x1="163" y1="72" x2="163" y2="284" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
  <line x1="163" y1="72" x2="163" y2="284" stroke="#2F7C57" stroke-width="4" stroke-linecap="butt"/>
  <path d="M163 66L157 76H169Z" fill="#2F7C57"/>
  <path d="M163 290L157 280H169Z" fill="#2F7C57"/>
  <line x1="175" y1="66" x2="224" y2="66" stroke="#9BCDB2" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="175" y1="290" x2="224" y2="290" stroke="#9BCDB2" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="66" y="158" width="70" height="36" rx="18" fill="#FFFFFF" stroke="#CFE5D8" stroke-width="2"/>
  <text class="label" x="101" y="182" text-anchor="middle" fill="#256846">足長</text>

  <line x1="230" y1="144" x2="328" y2="144" stroke="#FFFFFF" stroke-width="9" stroke-linecap="butt"/>
  <line x1="230" y1="144" x2="328" y2="144" stroke="#D96862" stroke-width="4" stroke-linecap="butt"/>
  <path d="M224 144L234 138V150Z" fill="#D96862"/>
  <path d="M334 144L324 138V150Z" fill="#D96862"/>
  <rect x="372" y="126" width="70" height="36" rx="18" fill="#FFFFFF" stroke="#F1D2CE" stroke-width="2"/>
  <text class="label" x="407" y="150" text-anchor="middle" fill="#B7524D">足幅</text>

  <circle cx="382" cy="92" r="7" fill="#E4F4EB"/>
  <path d="M379 92L381.5 95L386 89" fill="none" stroke="#347F59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="397" y="97">最も長い指まで</text>
  <circle cx="382" cy="190" r="7" fill="#FFF0EC"/>
  <path d="M379 190L381.5 193L386 187" fill="none" stroke="#D96862" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="397" y="195">付け根の横幅</text>

  <rect x="8" y="328" width="544" height="184" rx="26" fill="#FFF8F6" stroke="#EFDFD7" stroke-width="2"/>
  <rect x="28" y="346" width="126" height="30" rx="15" fill="#F2EAF8"/>
