  <text x="250" y="405" fill="#65599E" font-size="20" font-weight="900">足囲（一周）</text>
  <text class="note" x="250" y="433">親指と小指の付け根を通り、</text>
  <text class="note" x="250" y="456">メジャーを足のまわりに一周</text>
  <text x="250" y="484" fill="#7A8580" font-size="11" font-weight="600">立った状態で測ります</text>
</svg>
