<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">紙に基準線を引く方法</title>
  <desc id="desc">紙に縦線と横線を直角に引き、交点をかかとの基準位置にする図です。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d444d" flood-opacity=".12"/></filter>
    <style>text { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }</style>
  </defs>
  <rect x="8" y="8" width="664" height="414" rx="32" fill="#f3faf6" stroke="#dce9e1" stroke-width="2"/>
  <g transform="translate(23 0)">
    <g filter="url(#shadow)">
      <rect x="126" y="44" width="382" height="342" rx="10" fill="#fff"/>
    </g>
    <line x1="317" y1="72" x2="317" y2="350" stroke="#347f59" stroke-width="5"/>
    <line x1="163" y1="319" x2="471" y2="319" stroke="#d96862" stroke-width="5"/>
    <circle cx="317" cy="319" r="12" fill="#fff" stroke="#8173b7" stroke-width="5"/>
    <path d="M329 307l22-22" stroke="#8173b7" stroke-width="3"/>
    <rect x="353" y="255" width="176" height="52" rx="14" fill="#f0ecfb" stroke="#d9d2ee" stroke-width="2"/>
    <text x="441" y="278" text-anchor="middle" fill="#65599e" font-size="15" font-weight="900">かかとの基準位置</text>
    <text x="441" y="297" text-anchor="middle" fill="#6b6388" font-size="12" font-weight="700">縦線と横線の交点</text>
    <rect x="190" y="83" width="102" height="40" rx="20" fill="#e4f4eb"/>
    <text x="241" y="109" text-anchor="middle" fill="#256846" font-size="16" font-weight="900">縦線</text>
    <rect x="146" y="335" width="102" height="40" rx="20" fill="#fff0ec"/>
    <text x="197" y="361" text-anchor="middle" fill="#b7524d" font-size="16" font-weight="900">横線</text>
  </g>
</svg>
