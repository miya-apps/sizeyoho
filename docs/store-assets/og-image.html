<!DOCTYPE html>
<!-- OGP画像（1200x630）の生成テンプレート。
     書き出し：chrome headless --window-size=1200,630 --screenshot=docs/og-image.png
     文言はサイトのヒーロー（来シーズン、何cm？）と揃える。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG画像</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Zen Maru Gothic', sans-serif;
      color: #3D444D;
      background: linear-gradient(160deg, #C8EDDB 0%, #DDF3E7 55%, #EAF8F0 100%);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }
    .blob-1 { width: 340px; height: 340px; top: -140px; right: -80px; }
    .blob-2 { width: 260px; height: 260px; bottom: -120px; left: -70px; }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid rgba(76, 175, 135, 0.25);
    }
    .ring-1 { width: 120px; height: 120px; top: 80px; left: 90px; }
    .ring-2 { width: 70px; height: 70px; bottom: 90px; right: 130px; }
    .content { text-align: center; position: relative; }
    .icon {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      box-shadow: 0 12px 32px rgba(61, 68, 77, 0.20);
    }
    .brand {
      margin-top: 18px;
      font-size: 34px;
      font-weight: 900;
      color: #38875F;
      letter-spacing: 0.08em;
    }
    h1 {
      margin-top: 14px;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.02em;
    }
    .sub {
      margin-top: 16px;
      font-size: 30px;
      font-weight: 700;
      color: #55606B;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="content">
    <img class="icon" src="../icon.png" alt="">
    <div class="brand">サイズ予報</div>
    <h1>来シーズン、何cmを買えばいい？</h1>
    <p class="sub">服・靴・おむつのサイズを、成長の記録から予報</p>
  </div>
</body>
</html>
