<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1290">
  <title>ストア画像 5 — 全体訴求（A案・2画面合成）</title>
  <link rel="stylesheet" href="common.css">
</head>
<body class="slide-overview">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="headline">
      <h1>服・靴・おむつの<br>サイズを、まとめて予報</h1>
      <div class="accent-line"></div>
      <p>成長記録と足長から、<br>買い替え時期が見える</p>
    </div>

    <div class="phone-wrap">
      <div class="phone-duo">
        <div class="phone phone-back">
          <div class="phone-screen">
            <img src="../../store-submission/ios-raw/growth-curve.png" onerror="this.onerror=null;this.src='../screenshots/growth-curve.png'" alt="成長曲線画面">
          </div>
        </div>
        <div class="phone phone-front">
          <div class="phone-screen">
            <img src="../../store-submission/ios-raw/clothing-guide.png" onerror="this.onerror=null;this.src='../screenshots/clothing-guide.png'" alt="洋服ガイド画面">
          </div>
        </div>
      </div>
    </div>

    <p class="brand">サイズ予報</p>
  </div>
</body>
</html>
